# ===========================================================================
# 番茄免费小说 UI 自动化 —— 定位器候选集配置
# 多候选用 | 分隔，匹配时按顺序尝试，命中任一即视为匹配成功。
# App 改版改文案时只改此文件，不重新编译代码。
# 阶段 A3 实测后，用真实 dump 结果校准本文件。
# ===========================================================================

# 书架 Tab 文案（底部导航栏）
shelf.tab.text=书架|我的书架|书城书架

# 阅读页底部「观看视频获取免广告时长」入口文案
# 运营文案随版本/AB实验漂移，保留多种变体兜底
ad.entry.text=观看视频获取免广告时长|看视频免广告|领免广告时长|观看视频|免广告时长|免费时长|看视频领时长|观看视频领取免广告时长|领取免费时长

# 广告确认弹窗的「观看广告」按钮文案
ad.watch.text=观看广告|看广告|立即观看|观看视频领时长|领取|确认|开始观看|立即领取|看视频

# 广告视频结束后的「关闭」按钮文案
# 穿山甲 SDK 的关闭按钮文案变体较多，宽泛覆盖
ad.close.text=关闭|关闭广告|跳过|领取奖励|×|X|x|完成|已完成|关闭并领取

# 广告关闭按钮的 content-desc（无障碍描述）
# 穿山甲 SDK 常给关闭按钮设置 content-desc 而非 text
ad.close.desc=关闭|close|跳过|skip|关闭按钮|Close|dismiss

# 「继续获取免费时长」按钮文案
# 出现在关闭广告后的二次确认弹窗中
ad.continue.text=继续获取免费时长|继续观看|再看一个|继续领取|再来一次|继续|再看一个视频|继续获取|再看一条

# 奖励提取正则：从 UI 树文本中提取「N 分钟」的数值
# properties 文件中反斜杠需要双写转义
ad.reward.regex=(\\d+)\\s*分钟

# 「下一章」按钮文案（章节末尾出现）
chapter.next.text=下一章|下一章节|继续阅读|下一章继续阅读|翻到下一章

# 通用弹窗关闭/取消文案
# 覆盖：青少年模式弹窗、权限弹窗、登录弹窗、更新提示、网络异常等
common.dismiss.text=我知道了|以后再说|取消|暂不|跳过|不同意|知道了|下次再说|关闭|不再提示|忽略|稍后再说

# 阅读页菜单工具栏特征文案（点击正文中央弹出的工具栏）
# 待真机 dry-run dump 后校准
reader.menu.text=目录|设置|夜间|听书|字号|亮度|书签

# 开屏广告跳过按钮文案（冷启动时的全屏广告）
# 待真机 dry-run dump 后校准
# C1：本键曾与 ad.close.text 共享裸「跳过」，导致带「跳过」文案的广告关闭页/可跳过
# 激励视频被误判为 SPLASH_AD → 轮次计数与四重熔断失效、多本书轮换失效，且可能在
# 视频播放期误点「跳过」违反安全底线。故此处收窄为开屏专有的更长词，移除裸「跳过」，
# 让裸「跳过」仍归 ad.close.text 处理。（仅调整本轮新增的本键，未改动其它既有文案）
splash.skip.text=跳过广告|跳过开屏|跳过此广告|skip

# 每日配额耗尽提示文案（今日领取次数已达上限时弹出的提示）
# 命中任一文案时走「优雅收尾」分支（正常结束并汇总统计），而非落入 UNKNOWN 反复重试
# ★ 待真机校准：以下文案为经验推测，实际以番茄小说当日弹窗文案为准
# M1：移除高歧义的「明天再来」——签到/活动卡片等也可能出现该文案，会造成误判提前终止长跑。
# 仅保留明确的「达上限」语义文案。（仅调整本轮新增的本键）
daily.quota.exhausted.text=今日已达上限|已达今日上限|今日次数已用完

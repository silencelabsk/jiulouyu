# ===========================================================================
# 番茄免费小说 UI 自动化 —— 全局配置文件
# 所有超时、轮次、熔断阈值集中于此，改行为不改代码，代码中不出现魔法数字。
# ===========================================================================

# --- Appium Server 连接 ---
# Appium Server 的 HTTP 端点（本地默认 4723 端口）
appium.server.url=http://127.0.0.1:4723
# 目标平台
appium.platform.name=Android
# 自动化引擎：UiAutomator2 是 Android 原生 View 体系的唯一可靠选择
appium.automation.name=UiAutomator2
# 设备序列号：留空则 Appium 自动取第一个在线设备（多设备并行时必须填写）
appium.device.udid=UJN0220C17010611
# 目标 App 包名（番茄免费小说）
appium.app.package=com.dragon.read
# noReset=true 保留登录态与书架数据，是长任务必需的底线配置
# 若设为 false，每次创建 session 都会清除 App 数据，用户书架和登录全丢
appium.no.reset=true
# newCommandTimeout：session 无命令多久后自动断开（秒）
# 广告视频播放期约 30s 静默，加上翻页等待，默认 60s 极易触发断连
# 设为 1800s（30分钟）配合心跳保活，彻底规避此风险
appium.new.command.timeout.sec=1800
# UiAutomator2 Server 启动超时（毫秒）：session 建立后 server 拉起并响应的等待上限
appium.uia2.server.launch.timeout.ms=60000
# UiAutomator2 Server APK 推送并安装到设备的超时（毫秒）
# Appium 默认仅 20000ms，华为首装慢 +「监控 ADB 安装应用」弹窗常导致超时失败，放宽到 120s
appium.uia2.server.install.timeout.ms=120000
# 首轮安装成功后改为 true 可跳过重复安装（省 20-40 秒初始化）
# 本机三个 APK(io.appium.settings / uiautomator2.server / .server.test) 已装好，跳过安装避免被华为弹框拒装
appium.skip.server.installation=true
# 同上：设备初始化（io.appium.settings APK）跳过开关
appium.skip.device.initialization=true
# 保持屏幕常亮，防止长任务中途锁屏
appium.keep.screen.on=true

# --- 驱动类型（可扩展性） ---
# 决定 FanqieRunner 装配哪个 DriverFactory 实现。
# 当前仅实现 uiautomator2（标准 Appium 2 + UiAutomator2 路线）。
# 预留未来值：harmony_hdc（鸿蒙 NEXT / 5.x 兜底路线，adb 不可用时启用），
# 届时新增对应 DriverFactory 实现即可，上层零改动。未知值会回退到 uiautomator2。
driver.type=uiautomator2

# --- 时序控制 ---
# 状态轮询间隔（毫秒）：每 tick 的最小间隔，250ms 平衡响应速度与 RPC 压力
timing.poll.interval.ms=250
# 单次状态识别的超时上限（毫秒）
timing.state.detect.timeout.ms=3000
# 单次 UI 操作（点击/滑动）的超时上限（毫秒）
timing.action.timeout.ms=8000
# App 冷启动超时（毫秒）：华为设备冷启 + 开屏广告可能耗时较长
timing.app.launch.timeout.ms=30000
# 广告视频播放超时（毫秒）：激励视频含约 30s 正片 + 缓冲加载
timing.ad.video.timeout.ms=45000
# 等待关闭按钮出现的超时（毫秒）
timing.ad.close.ready.timeout.ms=15000
# 单状态最大滞留时间（毫秒）：超过此值说明流程卡死，触发恢复
timing.max.state.dwell.ms=90000
# 心跳间隔（秒）：RunLogger 每隔此时间执行保活 + 输出状态摘要
timing.heartbeat.interval.sec=30

# --- 业务流程控制 ---
# 每轮翻页数：翻 N 页后检查是否出现广告入口
flow.pages.per.cycle=200
# 单入口视频上限：用户描述的"好像可以观看四个"，作为熔断上限而非硬编码步数
flow.max.ad.rounds.per.entry=4
# 全局视频上限：防止无限循环消耗每日配额
flow.max.total.ad.rounds=40
# 业务目标（主退出条件）：累计领取的免广告分钟数
flow.target.free.minutes=120
# 奖励兜底估值（分钟）：当广告奖励弹窗未能提取到「N 分钟」数字时，
# 按此保守值累加，避免因运营文案漂移导致进度永远无法推进而无法退出
flow.reward.fallback.minutes=30
# 墙钟时间预算（毫秒）：长跑熔断保护，任务累计运行达到此值即优雅收尾退出。
# 默认 3 小时 = 10800000ms；设为 0 或负值表示不启用墙钟熔断
flow.max.wall.clock.ms=10800000
# 外层"翻页→再领时长"循环次数
flow.outer.cycles=5
# 连续错误达到此值触发 session 重建
flow.max.consecutive.errors=3
# 单次恢复流程的最大重试次数，超过则保留现场并退出
flow.max.recovery.retry=3

# --- 阅读页翻页策略 ---
# tap：点击屏幕右侧热区翻页（默认，最快最稳）
# swipe：滑动翻页（备选，某些 App 版本可能只响应滑动）
reader.turn.strategy=swipe
# 下一页点击位置：屏幕宽度的 85%（明确落在右三分之一内，避开中间菜单区）
reader.next.tap.ratio.x=0.85
# 下一页点击位置：屏幕高度的 50%（垂直居中）
reader.next.tap.ratio.y=0.50
# 上一页点击位置：屏幕宽度的 15%（左三分之一内）
reader.prev.tap.ratio.x=0.15
# swipe 策略的滑动距离百分比
reader.swipe.percent=0.6
# swipe 策略的滑动持续时间（毫秒）：过快可能被系统忽略
reader.swipe.duration.ms=300
# swipe 策略的阅读页内容区域 bounds（比例），滑动只在此区域内执行
# 避免滑到底部触发评论/菜单等控件
reader.content.top.ratio=0.10
reader.content.bottom.ratio=0.88
reader.content.left.ratio=0.02
reader.content.right.ratio=0.98

# --- 验证与调试 ---
# 截图哈希校验翻页成功开关（有 200-500ms 开销，默认关闭）
verify.page.turned.by.screenshot=false
# dry-run 模式：只连接并 dump UI 树，不执行任何点击操作
runtime.dry.run=false

# --- 日志清理 ---
# 日志保留天数：超过此天数的日志文件和快照文件在启动时自动清理，0 表示不清理
log.retention.days=3
